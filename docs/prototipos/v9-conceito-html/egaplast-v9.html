<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EGAPLAST · Protótipo conceitual v9</title>
<meta name="theme-color" content="#0D1B26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   EGAPLAST v9 — "Prancha técnica"
   Papel quente + tinta azul-marinho + azul da marca como sinal.
   Laranja SOMENTE para urgência. Mono para códigos e cotas.
   ========================================================= */
:root{
  --paper:#F3F0E8;--paper-2:#EAE6DA;--card:#FCFBF7;--ink:#0D1B26;--ink-2:#34444F;--muted:#586873;
  --line:#D8D2C3;--line-2:#C4BCA8;
  --brand:#0785C5;--brand-ink:#05689A;--brand-soft:#DCEEF8;
  --signal:#E4572E;--signal-ink:#A93A14;--signal-soft:#FBE3DA;
  --ok:#1F7A55;--ok-soft:#DBEEE4;--amber:#7A5600;--amber-soft:#F5E6B8;--bad:#B2312B;--bad-soft:#F8DDD9;
  --r:10px;--r-lg:16px;
  --f-ui:'Schibsted Grotesk',system-ui,'Segoe UI',sans-serif;
  --f-serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --sh1:0 1px 0 #0d1b2612,0 2px 10px #0d1b260c;--sh2:0 18px 50px #0d1b2630;
  --ease:cubic-bezier(.2,.7,.2,1);
  --demo-h:52px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;min-height:100dvh;
  background-image:linear-gradient(#0d1b2609 1px,transparent 1px),linear-gradient(90deg,#0d1b2609 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1000;opacity:.05;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-ink)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;z-index:3000}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--f-serif);font-weight:400}
.muted{color:var(--muted)}
.hide{display:none!important}
svg.ic{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Barra de demonstração ---------- */
#demobar{position:sticky;top:0;z-index:900;background:var(--ink);color:#E9E5D8;border-bottom:1px solid #000}
.db-in{max-width:1480px;margin:0 auto;min-height:var(--demo-h);padding:6px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.db-l{display:flex;align-items:center;gap:10px;min-width:0}
.db-badge{font:500 11px/1 var(--f-mono);letter-spacing:.08em;background:var(--signal);color:#fff;padding:5px 8px;border-radius:4px;white-space:nowrap}
.db-txt{font-size:12.5px;color:#B9C3CA}
.seg{display:inline-flex;background:#1B2E3C;border-radius:999px;padding:3px;margin-inline:auto}
.seg button{border:0;background:transparent;color:#C9D3DA;min-height:38px;padding:0 16px;border-radius:999px;font-weight:600;font-size:13.5px;transition:background .2s var(--ease),color .2s}
.seg button[aria-selected=true]{background:var(--paper);color:var(--ink)}
.seg button:not([aria-selected=true]):hover{color:#fff}
.db-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.db-r label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#C9D3DA;min-height:38px}
.db-r select{background:#1B2E3C;color:#fff;border:1px solid #2F4658;border-radius:8px;min-height:36px;padding:0 8px;font-size:12.5px}
.db-r input[type=checkbox]{width:18px;height:18px;accent-color:var(--signal)}
.db-btn{background:transparent;border:1px solid #3A5163;color:#E9E5D8;border-radius:8px;min-height:36px;padding:0 12px;font-size:12.5px;font-weight:600}
.db-btn:hover{background:#1B2E3C}

/* ---------- Primitivos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--ink);background:var(--card);font-weight:600;font-size:14px;transition:transform .15s var(--ease),background .2s,box-shadow .2s;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:#fff;box-shadow:var(--sh1)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:var(--brand-ink);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.ink{background:var(--ink);color:#fff}
.btn.ink:hover{background:#1C3040}
.btn.danger{background:var(--card);border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#0d1b260d;box-shadow:none}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.ib{width:44px;height:44px;display:inline-grid;place-items:center;border:1px solid var(--line-2);background:var(--card);border-radius:10px;position:relative}
.ib:hover{background:#fff}
.ib svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.pill.info{background:var(--brand-soft);color:var(--brand-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.done{background:#E2E6E9;color:var(--ink-2)}
.pill.sig{background:var(--signal-soft);color:var(--signal-ink)}
.tag{font:500 11px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--muted);border-radius:4px;padding:4px 6px;white-space:nowrap}
.tag.demo{border-style:dashed;color:var(--signal-ink);border-color:#E9A58E}
.eyebrow{font:500 11.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brand-ink)}
.sheet{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--sh1);position:relative}
.sheet.xm::before,.sheet.xm::after{content:"";position:absolute;width:11px;height:11px;border:0 solid var(--ink);opacity:.5;pointer-events:none}
.sheet.xm::before{left:-1px;top:-1px;border-left-width:2px;border-top-width:2px;border-top-left-radius:var(--r-lg)}
.sheet.xm::after{right:-1px;bottom:-1px;border-right-width:2px;border-bottom-width:2px;border-bottom-right-radius:var(--r-lg)}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 20px 12px;flex-wrap:wrap}
.sheet-h h2{font:400 24px/1.15 var(--f-serif)}
.sheet-h p{font-size:13px;color:var(--muted);margin-top:4px;max-width:62ch}
.sheet-b{padding:4px 20px 20px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--ink-2);background:var(--paper-2);border-left:3px solid var(--brand);padding:10px 12px;border-radius:0 8px 8px 0}
.note svg{margin-top:2px;color:var(--brand-ink)}
.note.warn{border-left-color:var(--signal);background:var(--signal-soft)}
.note.warn svg{color:var(--signal-ink)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h3{font:400 22px/1.2 var(--f-serif);color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:16px}
.field{display:grid;gap:6px}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.inp,textarea.inp,select.inp{width:100%;min-height:44px;border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:0 12px;transition:border-color .2s,box-shadow .2s}
textarea.inp{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.45}
.inp:hover{border-color:var(--ink-2)}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px #0785c533}
.inp.err{border-color:var(--bad)}
.errmsg{font-size:12.5px;color:var(--bad);display:flex;gap:6px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{font:500 11px var(--f-mono);opacity:.7}

/* ---------- Animações ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}}

/* ---------- Portal do lojista ---------- */
.l-top{position:sticky;top:var(--demo-h);z-index:800;background:#f3f0e8ea;backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.l-top-in{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:24px}
.wordmark{font:700 17px/1 var(--f-ui);letter-spacing:.26em;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink)}
.wordmark small{font:500 9.5px/1 var(--f-mono);letter-spacing:.16em;color:var(--muted)}
.l-nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.l-nav a{min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14px;white-space:nowrap;position:relative}
.l-nav a:hover{background:#0d1b260a}
.l-nav a[aria-current=page]{color:var(--ink)}
.l-nav a[aria-current=page]::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:3px;background:var(--brand);border-radius:2px}
.l-user{display:flex;align-items:center;gap:12px;font-size:13px}
.l-user b{display:block;line-height:1.2}
.l-user span{color:var(--muted);font-size:12px}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--signal);color:#fff;font:600 11px/20px var(--f-mono);text-align:center;padding:0 5px}
.page{max-width:1240px;margin:0 auto;padding:30px 24px 90px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.page-h h1{font:400 clamp(34px,4.2vw,52px)/1.02 var(--f-serif);letter-spacing:-.01em;margin-top:8px}
.page-h h1 em{font-style:italic;color:var(--brand-ink)}
.page-h p{color:var(--muted);margin-top:8px;max-width:58ch}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:grid;gap:20px}

/* Reposição */
.rep-list{list-style:none;margin:0;padding:0;display:grid;gap:0}
.rep-item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px dashed var(--line-2)}
.rep-item:first-child{border-top:0}
.rep-item input{width:22px;height:22px;accent-color:var(--brand)}
.rep-item .nm{font-weight:600}
.rep-item .why{font-size:12.5px;color:var(--muted);margin-top:2px}
.rep-qty{font:500 13px var(--f-mono);background:var(--paper-2);padding:6px 10px;border-radius:8px;white-space:nowrap}
.meter{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden;margin-top:8px;max-width:260px}
.meter i{display:block;height:100%;background:var(--signal);border-radius:3px}

/* Rastreador */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;counter-reset:s}
.track li{position:relative;text-align:center;font-size:12px;color:var(--muted);padding-top:34px}
.track li::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line-2)}
.track li:first-child::before{display:none}
.track li.done::before,.track li.now::before{background:var(--brand)}
.track .dot{position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--line-2);display:grid;place-items:center;font:500 12px var(--f-mono);z-index:1}
.track li.done .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.track li.now .dot{border-color:var(--brand);color:var(--brand-ink);box-shadow:0 0 0 5px #0785c52b}
.track li.now .lab{color:var(--ink);font-weight:700}
.track.dead li.now .dot{border-color:var(--bad);box-shadow:none}
.order-mini{padding:16px 0;border-top:1px dashed var(--line-2)}
.order-mini:first-of-type{border-top:0}
.order-mini .top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}
.order-mini a{font:500 14px var(--f-mono);color:var(--ink);text-decoration:none;border-bottom:1px solid var(--brand)}

/* Tabelas */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:#0785c50d}
.tbl .r{text-align:right}
.idlink{white-space:nowrap;cursor:pointer;font:500 13.5px var(--f-mono);color:var(--ink);text-decoration:none;border-bottom:1px solid var(--brand);background:none;border-top:0;border-left:0;border-right:0;padding:0}
.scroll-x{overflow-x:auto}

/* Catálogo */
.cat-bar{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:14px;align-items:center;margin-bottom:14px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .inp{padding-left:42px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-top:18px}
.pcard{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh1);transition:transform .25s var(--ease),box-shadow .25s}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.plate{position:relative;aspect-ratio:16/10;background:var(--paper-2);background-image:linear-gradient(#0d1b2610 1px,transparent 1px),linear-gradient(90deg,#0d1b2610 1px,transparent 1px);background-size:16px 16px;display:grid;place-items:center;color:var(--ink);border-bottom:1px solid var(--line-2);width:100%;border-top:0;border-left:0;border-right:0;padding:0}
button.plate{cursor:pointer}
.plate svg.art{width:62%;height:78%}
.plate .ref{position:absolute;left:12px;top:10px;font:500 12px var(--f-mono);background:var(--ink);color:#fff;padding:4px 8px;border-radius:4px}
.plate .dim{position:absolute;right:12px;bottom:10px;font:500 11.5px var(--f-mono);color:var(--brand-ink);display:flex;align-items:center;gap:6px}
.plate .dim::before{content:"";width:18px;height:7px;border:solid var(--brand-ink);border-width:0 1.5px;border-bottom:0;border-top:0;background:linear-gradient(var(--brand-ink),var(--brand-ink)) center/100% 1.5px no-repeat}
.plate .incart{position:absolute;right:10px;top:10px;background:var(--brand);color:#fff;font:600 11px var(--f-mono);padding:4px 8px;border-radius:999px}
.pbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.pbody .line{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pbody h3{font:600 16px/1.25 var(--f-ui)}
.pbody .desc{font-size:13px;color:var(--muted);line-height:1.4}
.pbody .mult{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.pfoot{margin-top:auto;display:grid;gap:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
.pctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.pctl .stepper{width:100%}.pctl .stepper input{flex:1;min-width:0;width:auto}
.price{font:600 17px var(--f-ui);font-variant-numeric:tabular-nums}
.price small{display:block;font:500 10px var(--f-mono);color:var(--signal-ink);letter-spacing:.06em;text-transform:uppercase}
.price.q{font-size:13px;color:var(--ink-2);font-weight:600}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;background:#fff;overflow:hidden}
.stepper button{width:40px;height:42px;border:0;background:transparent;display:grid;place-items:center}
.stepper button:hover{background:var(--paper-2)}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.stepper input{width:54px;height:42px;border:0;text-align:center;font:500 14px var(--f-mono);background:transparent;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:2px solid var(--brand);outline-offset:-2px}

/* Overlays */
#overlay .scrim{position:fixed;inset:0;background:#0d1b2670;z-index:1500;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--card);z-index:1510;display:flex;flex-direction:column;box-shadow:var(--sh2);animation:slidein .26s var(--ease);border-left:1px solid var(--ink)}
.drawer.wide{width:min(680px,100vw)}
.d-h{display:flex;justify-content:space-between;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.d-h h2{font:400 28px/1.1 var(--f-serif)}
.d-h p{color:var(--muted);font-size:13px;margin-top:4px}
.d-b{padding:18px 22px;overflow:auto;flex:1;display:grid;gap:22px;align-content:start}
.d-f{padding:14px 22px;border-top:1px solid var(--line-2);background:var(--paper);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;background:var(--card);border:1px solid var(--ink);border-radius:var(--r-lg);z-index:1520;box-shadow:var(--sh2);animation:pop .22s var(--ease)}
.modal .m-h{padding:20px 22px 6px}
.modal .m-h h2{font:400 26px/1.1 var(--f-serif)}
.modal .m-b{padding:8px 22px 18px;display:grid;gap:14px}
.modal .m-f{padding:14px 22px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--paper)}
.sec-t{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:500}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px dashed var(--line-2);font-size:14px}

.toast.out{opacity:0;transform:translateY(8px);transition:.25s}

const limit=o=>o.status==='recebido'?S.ui.sla*H:o.status==='em_analise'?24*H:null;
const waiting=o=>Date.now()-o.statusAt;
const stalled=o=>{const l=limit(o);return l!=null&&waiting(o)>l};
function unanswered(o){const ms=S.events.filter(e=>e.orderId===o.id&&e.type==='msg'&&e.vis==='cliente');const l=ms[ms.length-1];return !!l&&l.role==='loja'}
function flags(o){const f=[];
  if(stalled(o))f.push({k:'bad',t:'Parado há '+dur(waiting(o))});
  if(o.cancelReq&&!o.cancelReq.resolved)f.push({k:'bad',t:'Pedido de cancelamento'});
  if(unanswered(o)&&OPEN.includes(o.status))f.push({k:'warn',t:'Mensagem sem resposta'});
  if(total(o)>=8000&&['recebido','em_analise'].includes(o.status))f.push({k:'info',t:'Valor alto'});
  if(!o.assignee&&['recebido','em_analise'].includes(o.status))f.push({k:'warn',t:'Sem responsável'});
  return f}
function prio(o){let s=0;const l=limit(o);if(l)s+=Math.min(waiting(o)/l,3)*40;if(o.cancelReq&&!o.cancelReq.resolved)s+=35;if(unanswered(o))s+=15;s+=Math.min(total(o)/10000,1)*15;if(!o.assignee)s+=5;return s}

function transition(id,to,{actor,role,reason}){
  const o=S.orders.find(x=>x.id===id);if(!o)return{ok:false,error:'Pedido não encontrado.'};
  const from=o.status;
  if(role==='loja'&&!(from==='devolvido'&&to==='recebido'))return{ok:false,error:'Sem permissão para esta ação.'};
  if(!NEXT[from].includes(to))return{ok:false,error:`Transição não permitida: ${ST[from].l} → ${ST[to].l}.`};
  if((to==='devolvido'||to==='cancelado')&&(!reason||reason.trim().length<10))return{ok:false,error:'Informe o motivo (mínimo de 10 caracteres).'};
  o.status=to;o.statusAt=Date.now();
  if(to==='cancelado'&&o.cancelReq&&!o.cancelReq.resolved)o.cancelReq.resolved='aceito';
  logEv({orderId:o.id,clientId:o.cid,type:'status',actor,role,detail:`${ST[from].l} → ${ST[to].l}`,reason:(reason||'').trim()});
  save();return{ok:true};
}
const purchases=cid=>S.orders.filter(o=>o.cid===cid&&o.status==='concluido').sort((a,b)=>a.createdAt-b.createdAt);
const snap=(ref,q)=>{const st=P[ref].mult||1;return Math.max(st,Math.ceil((+q||st)/st)*st)};
/* Reposição: SOMENTE padrão histórico. Não conhece estoque. */
function replen(cid){
  const by={};purchases(cid).forEach(o=>o.items.forEach(i=>{(by[i.ref]=by[i.ref]||[]).push({at:o.createdAt,qty:i.qty})}));
  const openRefs=new Set(S.orders.filter(o=>o.cid===cid&&OPEN.includes(o.status)).flatMap(o=>o.items.map(i=>i.ref)));
  const out=[];
  Object.entries(by).forEach(([ref,l])=>{
    if(l.length<3||!P[ref])return;
    const gaps=l.slice(1).map((x,i)=>(x.at-l[i].at)/D),every=median(gaps),since=(Date.now()-l[l.length-1].at)/D,ratio=since/every;
    out.push({ref,n:l.length,every:Math.round(every),since:Math.round(since),ratio,qty:snap(ref,median(l.map(x=>x.qty))),inOpen:openRefs.has(ref)});
  });
  return out.filter(x=>x.ratio>=.8&&!x.inOpen).sort((a,b)=>b.ratio-a.ratio);
}
/* Compra conjunta: correlação de histórico ≠ compatibilidade técnica */
function together(ref){
  const w=S.orders.filter(o=>o.status==='concluido'&&o.items.some(i=>i.ref===ref));if(w.length<4)return[];
  const c={};w.forEach(o=>o.items.forEach(i=>{if(i.ref!==ref)c[i.ref]=(c[i.ref]||0)+1}));
  return Object.entries(c).map(([r,n])=>({ref:r,n,of:w.length})).sort((a,b)=>b.n-a.n);
}
function cstats(c){
  const h=purchases(c.id),ord=S.orders.filter(o=>o.cid===c.id&&o.status!=='cancelado');
  const last=ord.length?Math.max(...ord.map(o=>o.createdAt)):null;
  const gaps=h.slice(1).map((o,i)=>(o.createdAt-h[i].createdAt)/D);
  const refs={};h.forEach(o=>o.items.forEach(i=>refs[i.ref]=(refs[i.ref]||0)+i.qty));
  return{h,last,since:last?(Date.now()-last)/D:null,cycle:gaps.length?median(gaps):null,value:h.reduce((a,o)=>a+total(o),0),n:h.length,
    open:S.orders.filter(o=>o.cid===c.id&&OPEN.includes(o.status)).length,top:Object.entries(refs).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0])};
}

async function submitOrder(){
  if(UI.submitting||!S.cart.length)return;
  UI.submitting=true;UI.cartErr='';renderOverlay();
  const key=S.ckey||(S.ckey='idem-'+Math.random().toString(36).slice(2,10));save();
  await sleep(900);
  if(S.ui.fail){UI.submitting=false;UI.cartErr='Não foi possível enviar o pedido (falha de conexão simulada). Seu carrinho foi mantido e nada foi perdido. Pode tentar de novo com segurança: reenviar não duplica o pedido.';renderOverlay();return}
  let o=S.orders.find(x=>x.idem===key),fresh=false;
  if(!o){
    fresh=true;const id='EG-2026-'+pad(S.seq++),at=Date.now();
    o={id,cid:'c1',items:S.cart.map(l=>({ref:l.ref,qty:l.qty,price:P[l.ref].price})),status:'recebido',createdAt:at,statusAt:at,assignee:null,source:'portal',erp:null,idem:key};
    S.orders.push(o);
    logEv({orderId:id,clientId:'c1',type:'criado',actor:ME_LOJA.name,role:'loja',detail:'Pedido enviado pelo portal'});
    if((UI.draft.cnote||'').trim())logEv({orderId:id,clientId:'c1',type:'msg',actor:ME_LOJA.name,role:'loja',detail:UI.draft.cnote.trim(),vis:'cliente'});
  }
  S.cart=[];S.ckey=null;UI.draft.cnote='';UI.submitting=false;UI.repSel=null;save();
  closeAll(true);refreshChrome();go('#/loja/pedidos/'+o.id);
  toast(`Pedido ${o.id} enviado. Você recebeu o número de referência e pode acompanhar aqui.`);
}

/* =========================================================

function attention(){
  const items=[];
  S.orders.filter(o=>o.cancelReq&&!o.cancelReq.resolved).forEach(o=>items.push({sev:3,ico:'x',k:'bad',t:`Pedido de cancelamento · ${o.id}`,s:`${cname(o.cid)} · ${ago(o.cancelReq.at)}`,cta:'Analisar',href:'#/gestor/pedidos/'+o.id}));
  S.orders.filter(stalled).forEach(o=>items.push({sev:2,ico:'clock',k:'bad',t:`Pedido parado · ${o.id}`,s:`${cname(o.cid)} · ${ST[o.status].l} há ${dur(waiting(o))} (limite ${dur(limit(o))})`,cta:'Abrir pedido',href:'#/gestor/pedidos/'+o.id}));
  S.orders.filter(o=>unanswered(o)&&OPEN.includes(o.status)&&!stalled(o)&&!(o.cancelReq&&!o.cancelReq.resolved)).forEach(o=>items.push({sev:1.5,ico:'msg',k:'warn',t:`Mensagem sem resposta · ${o.id}`,s:cname(o.cid),cta:'Responder',href:'#/gestor/pedidos/'+o.id}));

  return `Olá, ${c.contact.split(' ')[0]}! Tudo bem? Aqui é ${c.owner.split(' ')[0]}, da EGAPLAST. Percebi que já faz ${Math.round(st.since)} dias desde o último pedido da ${c.name}. Nas últimas compras vocês levaram bastante ${names}. Quer que eu monte uma sugestão de reposição com base nesse histórico? Posso enviar para você aprovar.`;
}

/* ---------- Auditoria ---------- */
function viewAudit(){
  const f=UI.auditF,cnt=g=>S.events.filter(e=>grp(e)===g).length;
  const chip=(k,t,n)=>`<button class="chip" data-act="af" data-v="${k}" aria-pressed="${f.t===k}">${t}<span class="n">${n}</span></button>`;
  return `<div class="page-h rise"><div><div class="eyebrow">Rastreabilidade</div><h1>Trilha de <em>auditoria</em></h1><p>Quem fez o quê, quando e por quê. Registros não podem ser editados nem apagados.</p></div></div>
  <section class="sheet xm rise" style="--i:1"><div class="toolbar"><div class="search">${ic('search')}<input class="inp" id="aq" type="search" placeholder="Buscar por pedido, pessoa ou texto" aria-label="Buscar na auditoria" value="${esc(f.q)}"></div>
   <div class="chips" role="group" aria-label="Filtrar por tipo">${chip('todos','Todos',S.events.length)}${chip('pedidos','Pedidos',cnt('pedidos'))}${chip('internas','Notas internas',cnt('internas'))}${chip('cadastros','Cadastros e tarefas',cnt('cadastros'))}</div></div>
   <div class="scroll-x" id="auditRows"></div></section>`;
}
const grp=e=>e.vis==='interna'&&e.type==='msg'?'internas':(['cadastro','tarefa','tarefa_ok','export'].includes(e.type)?'cadastros':'pedidos');
function renderAuditRows(){
  const t=$('#auditRows');if(!t)return;const f=UI.auditF,q=f.q.trim().toLowerCase();
  let l=S.events.slice().sort((a,b)=>b.at-a.at);
  if(f.t!=='todos')l=l.filter(e=>grp(e)===f.t);
  if(q)l=l.filter(e=>((e.orderId||'')+' '+e.actor+' '+(e.detail||'')+' '+(e.reason||'')).toLowerCase().includes(q));
  const total=l.length;l=l.slice(0,80);
  t.innerHTML=l.length?`<table class="tbl stack-m"><thead><tr><th>Quando</th><th>Responsável</th><th>Ação</th><th>Referência</th><th>Detalhe</th></tr></thead><tbody>`+l.map(e=>`<tr><td data-l="Quando" class="mono" style="font-size:12.5px;white-space:nowrap">${fmtDT(e.at)}</td><td data-l="Responsável"><b>${esc(e.actor)}</b><div class="muted" style="font-size:12px">${e.role==='gestor'?'Equipe EGAPLAST':e.role==='loja'?'Lojista':'Sistema'}</div></td>
   <td data-l="Ação">${esc(evLabel(e))}${e.vis==='interna'?` <span class="pill warn">${ic('lock',11)}Interna</span>`:''}</td><td data-l="Referência">${e.orderId?`<button class="idlink" data-act="gopenid" data-id="${e.orderId}">${e.orderId}</button>`:'—'}</td>
   <td data-l="Detalhe" style="max-width:420px">${esc(e.detail||'')}${e.reason?`<div class="muted" style="font-size:12.5px;margin-top:2px">Motivo: ${esc(e.reason)}</div>`:''}</td></tr>`).join('')+`</tbody></table>${total>80?`<p class="muted" style="padding:12px 20px;font-size:12.5px">Mostrando os 80 registros mais recentes de ${total}.</p>`:''}`:`<div class="empty"><h3>Nenhum registro encontrado</h3><p>Ajuste a busca ou o filtro.</p></div>`;
}

/* =========================================================
   OVERLAYS (drawer + modal)
   ========================================================= */
function openDrawer(d,fromRoute){if(!OV.drawer&&!OV.modal)lastFocus=document.activeElement;OV.drawer={...d,fromRoute};renderOverlay();}
function openModal(m){if(!OV.drawer&&!OV.modal)lastFocus=document.activeElement;OV.modal=m;renderOverlay();}
function closeAll(silent){OV.drawer=null;OV.modal=null;renderOverlay();if(!silent&&lastFocus&&document.contains(lastFocus))lastFocus.focus();}
function closeTop(){
  if(OV.modal){OV.modal=null;renderOverlay();return}
  const fr=OV.drawer&&OV.drawer.fromRoute;OV.drawer=null;renderOverlay();
  if(fr)history.replaceState(null,'','#/gestor/pedidos');
  if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
}
function dShell(title,sub,body,foot,wide){
  return `<div class="scrim" data-act="close"></div><aside class="drawer ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dtitle"><header class="d-h"><div><h2 id="dtitle">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="ib" data-act="close" aria-label="Fechar painel">${ic('x')}</button></header><div class="d-b" id="dbody">${body}</div>${foot?`<footer class="d-f">${foot}</footer>`:''}</aside>`;
}
function renderOverlay(){
  const root=$('#overlay'),prev=$('#dbody'),sc=prev?prev.scrollTop:0;
  let html='';const d=OV.drawer;
  if(d){
    if(d.k==='cart'){const c=cartView();html+=dShell('Seu carrinho','Revise antes de enviar',c.body,c.foot)}
    else if(d.k==='gorder'){const x=drawerOrder(d.id);html+=dShell(x.title,x.sub,x.body,'',x.wide)}
    else if(d.k==='gclient'){const x=drawerClient(d.id);html+=dShell(x.title,x.sub,x.body,'')}
    else if(d.k==='product'){const p=P[d.ref],inC=S.cart.find(l=>l.ref===p.ref);
      html+=dShell(esc(p.name),`<span class="mono">REF. ${p.ref}</span> · ${esc(p.line)}`,`<div class="plate" style="border:1px solid var(--line-2);border-radius:14px;aspect-ratio:16/8">${artSvg(p.art)}<span class="dim">${esc(p.dim)}</span></div>
       <div><div class="sec-t">Especificações do catálogo</div><ul class="spec">${p.spec.map(s=>`<li>${ic('check',16)}<span>${esc(s)}</span></li>`).join('')}</ul></div>
       <div><div class="sec-t">Logística de venda</div><dl class="kv"><dt>Múltiplo de venda</dt><dd>${p.mult?p.mult+' unidades':'a confirmar'}</dd><dt>Estoque</dt><dd>Não informado (sem integração)</dd><dt>Compatibilidade</dt><dd>Será exibida apenas quando documentada</dd></dl></div>
       <div class="note">${ic('info',16)}<div>Fonte: Catálogo EGAPLAST 2023, p. ${p.pg}. O desenho é uma ilustração técnica, não uma foto. Confirmar vigência com a EGAPLAST.</div></div>`,
       `<div>${showPrice()?`<div class="price"><small>Preço demo</small>${brl(p.price)}</div>`:`<div class="price q">Preço sob consulta</div>`}</div><button class="btn primary" data-act="add" data-ref="${p.ref}" data-q="${p.mult||1}">${ic('cart')}Adicionar ${p.mult||1} un.</button>`)}
  }
  const m=OV.modal;
  if(m){
    if(m.k==='reason'){html+=`<div class="scrim" style="z-index:1515" data-act="close"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" style="z-index:1520"><div class="m-h"><h2 id="mt">${esc(m.title)}</h2></div><div class="m-b"><p style="color:var(--ink-2)">${m.desc}</p>
      <div class="field"><label for="reasonTxt">Motivo ${m.req?'(obrigatório)':''}</label><textarea class="inp ${UI.pending.err?'err':''}" id="reasonTxt" data-draft="reason" placeholder="${esc(m.ph||'')}" aria-describedby="rerr">${esc(UI.draft.reason||'')}</textarea>${UI.pending.err?`<span class="errmsg" id="rerr" role="alert">${ic('alert',14)}${esc(UI.pending.err)}</span>`:''}</div></div>
      <div class="m-f"><button class="btn" data-act="close">Voltar</button><button class="btn ${m.danger?'danger':'primary'}" data-act="reasonOk">${esc(m.cta)}</button></div></div>`}
    else if(m.k==='about')html+=aboutModal();
    else if(m.k==='confirm')html+=`<div class="scrim" style="z-index:1515" data-act="close"></div><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mt" style="z-index:1520"><div class="m-h"><h2 id="mt">${esc(m.title)}</h2></div><div class="m-b"><p style="color:var(--ink-2)">${m.desc}</p></div><div class="m-f"><button class="btn" data-act="close">Cancelar</button><button class="btn ${m.danger?'danger':'primary'}" data-act="confirmOk">${esc(m.cta)}</button></div></div>`;
  }
  root.innerHTML=html;
  const nb=$('#dbody');if(nb&&prev)nb.scrollTop=sc;
  document.body.style.overflow=(d||m)?'hidden':'';
  if(d||m){const first=$('#overlay .modal textarea')||$('#overlay .modal button')||$('#overlay .drawer .ib');if(first&&!document.activeElement.closest?.('#overlay'))first.focus({preventScroll:true})}
}

 reqCancel:el=>ensureReason({title:'Solicitar cancelamento',desc:'A EGAPLAST analisará a solicitação e responderá aqui. O motivo é obrigatório e fica registrado no pedido.',cta:'Enviar solicitação',danger:true,req:true,ph:'Explique por que deseja cancelar este pedido.'},
   txt=>{const o=S.orders.find(x=>x.id===el.dataset.id);o.cancelReq={at:Date.now(),reason:txt,resolved:null};logEv({orderId:o.id,clientId:o.cid,type:'cancel_solic',actor:ME_LOJA.name,role:'loja',detail:'Solicitou cancelamento do pedido',reason:txt});save();closeAll(true);route();toast('Solicitação enviada. Acompanhe a resposta neste pedido.')}),
 reasonOk:()=>{const t=(UI.draft.reason||'').trim();if(t.length<10){UI.pending.err='Descreva o motivo com pelo menos 10 caracteres.';renderOverlay();$('#reasonTxt')?.focus();return}
   const f=UI.pending.onOk;UI.pending={};UI.draft.reason='';OV.modal=null;f(t);if(OV.drawer||OV.modal)renderOverlay()},
 /* gestor */
 kpi:el=>{const f=el.dataset.f,t=el.dataset.t;if(f==='parados')UI.f={q:'',status:'parados',who:'todos',attn:false};if(f==='analise')UI.f={q:'',status:'analise',who:'todos',attn:false};if(t)UI.tab=t},
 gotab:el=>{UI.tab=el.dataset.t},
 tab:el=>{UI.tab=el.dataset.v;route()},
 gopen:el=>{if(OV.drawer)return;history.replaceState(null,'','#/gestor/pedidos/'+el.dataset.id);openDrawer({k:'gorder',id:el.dataset.id},true)},
 gopenid:el=>{closeAll(true);go('#/gestor/pedidos/'+el.dataset.id)},
 clearo:()=>{UI.f={q:'',status:'abertos',who:'todos',attn:false};route()},
 gmode:el=>{UI.mode[el.dataset.id]=el.dataset.m;renderOverlay()},
 gsend:el=>{const id=el.dataset.id,t=(UI.draft['g'+id]||'').trim(),interna=(UI.mode[id]||'cliente')==='interna';if(!t){toast('Escreva o texto antes de enviar.','err');return}
   const o=S.orders.find(x=>x.id===id);logEv({orderId:id,clientId:o.cid,type:'msg',actor:ME_GESTOR.name,role:'gestor',detail:t,vis:interna?'interna':'cliente'});UI.draft['g'+id]='';save();renderOverlay();
   toast(interna?'Nota interna salva. O lojista não consegue vê-la.':'Mensagem enviada ao lojista.')},
 gerp:el=>{const v=($('#erp')?.value||'').trim(),o=S.orders.find(x=>x.id===el.dataset.id);if(!v){toast('Informe o número do pedido no ERP.','err');return}
   o.erp=v;logEv({orderId:o.id,clientId:o.cid,type:'erp',actor:ME_GESTOR.name,role:'gestor',detail:`Nº do ERP registrado: ${v}`,vis:'interna'});save();renderOverlay();toast('Número do ERP salvo (registro manual).')},
 gtrans:el=>{const id=el.dataset.id,to=el.dataset.to;
   if(to==='devolvido'||to==='cancelado')return ensureReason({title:to==='devolvido'?'Devolver para correção':'Cancelar pedido',desc:to==='devolvido'?'O lojista verá este motivo e poderá corrigir e reenviar o pedido.':'O cancelamento é definitivo e o lojista verá o motivo.',cta:to==='devolvido'?'Devolver pedido':'Cancelar pedido',danger:to==='cancelado',req:true,ph:to==='devolvido'?'Ex.: quantidade da ref. 10215 fora do múltiplo de venda.':'Ex.: pedido duplicado confirmado com o cliente.'},
     txt=>{const r=transition(id,to,{actor:ME_GESTOR.name,role:'gestor',reason:txt});r.ok?toast(`Pedido ${id}: ${ST[to].l.toLowerCase()}.`):toast(r.error,'err');renderOrdersTable?.();route2()});
   const r=transition(id,to,{actor:ME_GESTOR.name,role:'gestor'});r.ok?toast(`Pedido ${id}: ${ST[to].l.toLowerCase()}.`):toast(r.error,'err');route2()},
 gcancelAccept:el=>ensureReason({title:'Aceitar cancelamento',desc:'Confirme o motivo do cancelamento. O lojista será informado.',cta:'Cancelar pedido',danger:true,req:true,ph:'Ex.: cancelamento acordado com o cliente; pedido substituído.'},
   txt=>{const r=transition(el.dataset.id,'cancelado',{actor:ME_GESTOR.name,role:'gestor',reason:txt});r.ok?toast('Pedido cancelado e lojista informado.'):toast(r.error,'err');route2()}),
 gcancelRefuse:el=>ensureReason({title:'Recusar solicitação',desc:'O pedido segue em andamento. O lojista verá a justificativa.',cta:'Recusar solicitação',req:true,ph:'Ex.: pedido já foi separado e não pode mais ser cancelado.'},
   txt=>{const o=S.orders.find(x=>x.id===el.dataset.id);o.cancelReq.resolved='recusado';logEv({orderId:o.id,clientId:o.cid,type:'cancel_recusado',actor:ME_GESTOR.name,role:'gestor',detail:'Recusou a solicitação de cancelamento',reason:txt});save();toast('Solicitação recusada.');route2()}),
 bAn:()=>batch('recebido','em_analise'),bOk:()=>batch('em_analise','aprovado'),bClr:()=>{UI.sel.clear();renderOrdersTable()},
 csv:()=>exportCsv(),
 cdetail:el=>openDrawer({k:'gclient',id:el.dataset.id}),
 days:el=>{UI.days=+el.dataset.v;route()},
 copy:async el=>{const t=$('#'+el.dataset.key)?.value||'';try{await navigator.clipboard.writeText(t);toast('Mensagem copiada. Envie pelo canal que você já usa com o cliente.')}catch(e){toast('Não foi possível copiar automaticamente. Selecione o texto e copie manualmente.','err')}},
 mktask:el=>{const cid=el.dataset.id,c=S.clients.find(x=>x.id===cid),owner=$('#ts-'+cid).value;
   S.tasks.push({id:'t'+Date.now(),cid,owner,due:Date.now()+2*D,text:'Contatar para recompra (sem pedidos há '+Math.round(cstats(c).since)+' dias)',done:false,at:Date.now()});
   logEv({clientId:cid,type:'tarefa',actor:ME_GESTOR.name,role:'gestor',detail:`Tarefa criada para ${owner}: contatar ${c.name}`,vis:'interna'});save();route();toast(`Tarefa criada para ${owner}, com prazo em 2 dias.`)},
 sapprove:el=>{const s=S.signups.find(x=>x.id===el.dataset.id);s.status='aprovado';s.by=ME_GESTOR.name;s.decidedAt=Date.now();
   S.clients.push({id:'c'+(S.clients.length+1)+Date.now()%1000,name:s.name,city:s.city,type:s.type,contact:s.contact,owner:VENDORS[0]});
   logEv({clientId:null,type:'cadastro',actor:ME_GESTOR.name,role:'gestor',detail:`Aprovou o cadastro de ${s.name}`,vis:'interna'});save();route();toast(`${s.name} aprovada. Aprovador e data registrados.`)},
 sreject:el=>ensureReason({title:'Rejeitar cadastro',desc:'Informe o motivo para registro. Cadastros rejeitados não têm acesso ao portal.',cta:'Rejeitar cadastro',danger:true,req:true,ph:'Ex.: CNPJ inativo na Receita Federal.'},
   txt=>{const s=S.signups.find(x=>x.id===el.dataset.id);s.status='rejeitado';s.by=ME_GESTOR.name;s.decidedAt=Date.now();s.reason=txt;logEv({type:'cadastro',actor:ME_GESTOR.name,role:'gestor',detail:`Rejeitou o cadastro de ${s.name}`,reason:txt,vis:'interna'});save();route();toast('Cadastro rejeitado e registrado.')}),
 af:el=>{UI.auditF.t=el.dataset.v;route()}
};
function route2(){const keep=OV.drawer;renderDemoBar();const r=parse();if(r.area==='gestor'){const pg=r.page||'visao';renderGestorKeep(pg)}else route();OV.drawer=keep;renderOverlay()}
function renderGestorKeep(pg){
  if(pg==='pedidos'){$('#app').innerHTML=gShell('pedidos',viewGOrders());renderOrdersTable()}
  else if(pg==='clientes')$('#app').innerHTML=gShell('clientes',viewGClients());
  else if(pg==='auditoria'){$('#app').innerHTML=gShell('auditoria',viewAudit());renderAuditRows()}
  else $('#app').innerHTML=gShell('visao',viewGHome());
}
function batch(from,to){
  let ok=0;[...UI.sel].forEach(id=>{const o=S.orders.find(x=>x.id===id);if(o&&o.status===from&&transition(id,to,{actor:ME_GESTOR.name,role:'gestor'}).ok)ok++});
  UI.sel.clear();route2();toast(`${ok} ${ok===1?'pedido atualizado':'pedidos atualizados'} para “${ST[to].l}”. Cada alteração foi registrada na auditoria.`);
}
function stepPq(ref,dir){const st=P[ref].mult||1;const cur=UI.pq[ref]||st;UI.pq[ref]=Math.max(st,cur+dir*st);const i=$(`input[data-on=pq][data-ref="${ref}"]`);if(i)i.value=UI.pq[ref]}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='noop'){e.stopPropagation();return}
  if(el.tagName==='A'&&(a==='kpi'||a==='gotab'||a==='close')){ACT[a]?.(el);return}
  if(ACT[a]){ACT[a](el,e)}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-on]');
  if(!el){const t=e.target;if(t.id==='ost'){UI.f.status=t.value;renderOrdersTable()}else if(t.id==='owho'){UI.f.who=t.value;renderOrdersTable()}return}
  const k=el.dataset.on;
  if(k==='fail'){S.ui.fail=el.checked;save();toast(el.checked?'Falha de rede simulada ATIVADA: envios de pedido vão falhar (carrinho preservado).':'Falha de rede simulada desativada.')}
  else if(k==='prices'){S.ui.prices=el.value;save();route();if(OV.drawer)renderOverlay()}
  else if(k==='rep'){el.checked?UI.repSel.add(el.dataset.ref):UI.repSel.delete(el.dataset.ref)}
  else if(k==='pq'){const ref=el.dataset.ref,v=snap(ref,el.value);if(+el.value!==v)toast(`Quantidade ajustada para ${v} (múltiplo de ${P[ref].mult||1}).`);UI.pq[ref]=v;el.value=v}
  else if(k==='cq'){const l=S.cart.find(x=>x.ref===el.dataset.ref),v=snap(l.ref,el.value);if(+el.value!==v)toast(`Quantidade ajustada para ${v} (múltiplo de ${P[l.ref].mult||1}).`);l.qty=v;S.ckey=null;save();renderOverlay()}
  else if(k==='sel'){el.checked?UI.sel.add(el.dataset.id):UI.sel.delete(el.dataset.id);renderBatch()}
  else if(k==='assign'){const o=S.orders.find(x=>x.id===el.dataset.id),v=el.value;o.assignee=v||null;logEv({orderId:o.id,clientId:o.cid,type:'atribuido',actor:ME_GESTOR.name,role:'gestor',detail:v?`Atribuiu o pedido a ${v}`:'Removeu o responsável',vis:'interna'});save();toast(v?`Pedido ${o.id} atribuído a ${v}.`:'Responsável removido.');route2()}
  else if(k==='bAssign'){const v=el.value;if(!v)return;UI.sel.forEach(id=>{const o=S.orders.find(x=>x.id===id);if(o&&OPEN.includes(o.status)){o.assignee=v;logEv({orderId:o.id,clientId:o.cid,type:'atribuido',actor:ME_GESTOR.name,role:'gestor',detail:`Atribuiu o pedido a ${v}`,vis:'interna'})}});save();toast(`${UI.sel.size} pedido(s) atribuído(s) a ${v}.`);route2()}
  else if(k==='tdone'){const t=S.tasks.find(x=>x.id===el.dataset.id);t.done=el.checked;if(t.done)logEv({clientId:t.cid,type:'tarefa_ok',actor:ME_GESTOR.name,role:'gestor',detail:`Concluiu tarefa: ${t.text}`,vis:'interna'});save();route()}
  else if(k==='osla'){}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.draft!==undefined){UI.draft[t.dataset.draft]=t.value;return}
  if(t.id==='catQ'){UI.cat.q=t.value;renderCatGrid()}
  else if(t.id==='oq'){UI.f.q=t.value;renderOrdersTable()}
  else if(t.id==='aq'){UI.auditF.q=t.value;renderAuditRows()}
  else if(t.id==='osla'){const v=Math.max(1,Math.min(48,+t.value||4));S.ui.sla=v;save();renderOrdersTable();const n=$('.g-nav a[href="#/gestor/pedidos"] .cnt');}
  else if(t.dataset.on==='days'){UI.days=+t.value;const o=$('#daysOut');if(o)o.textContent=t.value;t.setAttribute('aria-valuetext',t.value+' dias');clearTimeout(UI._dt);UI._dt=setTimeout(()=>{const f=document.activeElement===t;route();if(f)$('#days')?.focus()},180)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(OV.drawer||OV.modal)){e.preventDefault();closeTop();return}
  if(e.key==='Tab'&&(OV.drawer||OV.modal)){
    const box=$('#overlay .modal')||$('#overlay .drawer');if(!box)return;
    const f=$$('button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea,[tabindex]:not([tabindex="-1"])',box).filter(x=>x.offsetParent!==null);
    if(!f.length)return;const a=f[0],b=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}else if(!box.contains(document.activeElement)){e.preventDefault();a.focus()}
  }
  if(e.key==='Enter'&&e.target.matches?.('tr.click')){e.target.click()}
});
window.addEventListener('hashchange',()=>{if(OV.drawer&&OV.drawer.k!=='gorder'||OV.modal){OV.modal=null;OV.drawer=null;renderOverlay()}route()});
if(!location.hash)location.hash='#/'+(S.ui.role||'loja');
route();
})();
</script>
</body>
